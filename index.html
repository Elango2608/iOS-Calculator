<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Calculator</title>
    <link rel="stylesheet" href="calculatorstyle.css">
    <script src="calculatorscript.js" defer></script>
</head>
<body>

    <main class="container" role="application" aria-label="Calculator">
        <h1>iOS Calculator</h1>

        <div class="display" id="display" aria-live="polite" aria-atomic="true">0</div>

        <div class="buttons" role="group" aria-label="Calculator buttons">
            <button class="function" data-action="clear" aria-label="Clear">AC</button>
            <button class="function" data-action="double-zero" aria-label="Double zero">00</button>
            <button class="function" data-action="percent" aria-label="Percent">%</button>
            <button class="operator" data-action="operator" data-value="/" aria-label="Divide">/</button>

            <button class="num" data-value="7" aria-label="7">7</button>
            <button class="num" data-value="8" aria-label="8">8</button>
            <button class="num" data-value="9" aria-label="9">9</button>
            <button class="operator" data-action="operator" data-value="*" aria-label="Multiply">×</button>

            <button class="num" data-value="4" aria-label="4">4</button>
            <button class="num" data-value="5" aria-label="5">5</button>
            <button class="num" data-value="6" aria-label="6">6</button>
            <button class="operator" data-action="operator" data-value="-" aria-label="Subtract">−</button>

            <button class="num" data-value="1" aria-label="1">1</button>
            <button class="num" data-value="2" aria-label="2">2</button>
            <button class="num" data-value="3" aria-label="3">3</button>
            <button class="operator" data-action="operator" data-value="+" aria-label="Add">+</button>

            <button class="num zero" data-value="0" aria-label="0">0</button>
            <button class="num" data-action="decimal" aria-label="Decimal point">.</button>
            <button class="operator" data-action="equals" aria-label="Equals">=</button>
        </div>
    </main>

</body>
</html>
